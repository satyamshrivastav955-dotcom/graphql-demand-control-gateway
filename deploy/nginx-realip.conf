# Only mounted by deploy/docker-compose.prod.yml, where Caddy is the single trusted proxy in front of nginx.
# Trust X-Forwarded-For only from the private Docker network, so $remote_addr (and therefore the
# X-Forwarded-For nginx sends to the gateway) is the real visitor address.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
