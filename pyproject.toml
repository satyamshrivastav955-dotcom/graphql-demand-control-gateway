[tool.pytest.ini_options]
testpaths = ["backend/tests", "sentinel_core/tests", "benchmarks/tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dashboard", "ml/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008", "E501", "E702"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["B011", "E731"]
"benchmarks/corpus/gen_corpus.py" = ["UP031"]  # %-formatting kept so corpus bytes stay reproducible
