schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION)
  @link(url: "https://specs.apollo.dev/cost/v0.1", import: ["@listSize"])
{
  query: Query
  mutation: Mutation
}

directive @cost(weight: Int!) on ARGUMENT_DEFINITION | ENUM | FIELD_DEFINITION | INPUT_FIELD_DEFINITION | OBJECT | SCALAR

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String, contextArguments: [join__ContextArgument!]) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @listSize(assumedSize: Int, slicingArguments: [String!], sizedFields: [String!], requireOneSlicingArgument: Boolean = true) on FIELD_DEFINITION

type AuthPayload
  @join__type(graph: DEMO)
{
  token: String!
  user: User
}

type Comment
  @join__type(graph: DEMO)
{
  id: ID!
  text: String!
  author: User!
  replies(first: Int = 10): [Comment!]! @listSize(slicingArguments: ["first"], assumedSize: 10)
}

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

scalar join__DirectiveArguments

scalar join__FieldSet

scalar join__FieldValue

enum join__Graph {
  DEMO @join__graph(name: "demo", url: "http://upstream:8001/graphql")
}

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY

  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

type Mutation
  @join__type(graph: DEMO)
{
  login(email: String!, password: String!): AuthPayload!
  createPost(title: String!, body: String!): Post!
}

type Post
  @join__type(graph: DEMO)
{
  id: ID!
  title: String!
  body: String!
  author: User!
  comments(first: Int = 10): [Comment!]! @listSize(slicingArguments: ["first"], assumedSize: 10)
}

type Product
  @join__type(graph: DEMO)
{
  id: ID!
  name: String!
  price: Float!
  stock: Int!
}

type Query
  @join__type(graph: DEMO)
{
  me: User
  user(id: ID!): User
  users(first: Int = 10): [User!]! @listSize(slicingArguments: ["first"], assumedSize: 10)
  post(id: ID!): Post
  posts(first: Int = 10): [Post!]! @listSize(slicingArguments: ["first"], assumedSize: 10)
  product(id: ID!): Product
  products(first: Int = 10): [Product!]! @listSize(slicingArguments: ["first"], assumedSize: 10)
}

type User
  @join__type(graph: DEMO)
{
  id: ID!
  name: String!
  username: String!
  email: String!
  role: String!
  apiToken: String!
  friends(first: Int = 10): [User!]! @listSize(slicingArguments: ["first"], assumedSize: 10)
  posts(first: Int = 10): [Post!]! @listSize(slicingArguments: ["first"], assumedSize: 10)
}