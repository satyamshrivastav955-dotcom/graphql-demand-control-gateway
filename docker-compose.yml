# GraphQL Sentinel demo stack:  docker compose up --build
#   dashboard + gateway  http://localhost:8080
#   gateway API          http://localhost:8000   (POST /graphql-proxy)
# The demo upstream is only reachable inside the compose network.

services:
  upstream:
    build:
      context: .
      dockerfile: docker/demo-upstream.Dockerfile
    restart: unless-stopped
    environment:
      # Safety fuse for a public demo host: an operation is aborted after this many field resolutions. It still counts
      # as having reached the unprotected executor. Set to 0 to disable.
      DEMO_WORK_BUDGET: ${DEMO_WORK_BUDGET:-200000}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      SENTINEL_UPSTREAM_URL: http://upstream:8001/graphql
      SENTINEL_MODE: proxy
      # Optional: `shadow` records real decisions but forwards everything (report-only rollout).
      SENTINEL_ENFORCEMENT: ${SENTINEL_ENFORCEMENT:-enforce}
      # Optional: Slack-compatible webhook for blocked operations (secret).
      SENTINEL_ALERT_WEBHOOK_URL: ${SENTINEL_ALERT_WEBHOOK_URL:-}
      # Optional, comma-separated (each >= 16 chars): require X-API-Key on /graphql-proxy.
      SENTINEL_GATEWAY_KEYS: ${SENTINEL_GATEWAY_KEYS:-}
      # Required: protects the management API (events, metrics, config, dry-run, live stream). Min 16 chars.
      SENTINEL_API_TOKEN: ${SENTINEL_API_TOKEN:?Set SENTINEL_API_TOKEN (min 16 chars) in .env - see .env.example}
      SENTINEL_INTROSPECTION: ${SENTINEL_INTROSPECTION:-flag}
      # nginx (the only public entry point) overwrites X-Forwarded-For with the real client address.
      # The backend port is published on 127.0.0.1 only; do not expose it publicly while this is true.
      SENTINEL_TRUST_PROXY_HEADERS: ${SENTINEL_TRUST_PROXY_HEADERS:-true}
      SENTINEL_CORS_ORIGINS: ${SENTINEL_CORS_ORIGINS:-http://localhost:8080}
      # Schema-aware cost (Apollo-compatible @listSize) and structured decision logs; OpenTelemetry export is on when
      # SENTINEL_OTLP_ENDPOINT is set (see the `observability` profile below).
      SENTINEL_SCHEMA_PATH: /schema/schema.graphql
      SENTINEL_TELEMETRY__DECISION_LOG: ${SENTINEL_DECISION_LOG:-json}
      SENTINEL_TELEMETRY__ENABLED: ${SENTINEL_TELEMETRY_ENABLED:-false}
      SENTINEL_OTLP_ENDPOINT: ${SENTINEL_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${SENTINEL_BACKEND_PORT:-8000}:8000"
    volumes:
      - sentinel-data:/data
      - ./demo/upstream/schema.graphql:/schema/schema.graphql:ro
    depends_on:
      upstream:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 512m

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SENTINEL_DASHBOARD_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # --- optional: docker compose --profile observability up --build  (Grafana :3000, Prometheus :9090, Jaeger :16686)
  # Traces need SENTINEL_TELEMETRY_ENABLED=true and SENTINEL_OTLP_ENDPOINT=http://jaeger:4318 in .env.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.12.0
    entrypoint: ["/bin/sh", "-c", "printf %s \"$$SENTINEL_API_TOKEN\" > /tmp/sentinel-token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=2d"]
    environment:
      SENTINEL_API_TOKEN: ${SENTINEL_API_TOKEN:?Set SENTINEL_API_TOKEN}
    volumes: ["./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [backend]
    restart: unless-stopped
  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.76.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["127.0.0.1:${JAEGER_PORT:-16686}:16686"]
    restart: unless-stopped
  grafana:
    profiles: [observability]
    image: grafana/grafana:12.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-change-me-now}
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  sentinel-data:
