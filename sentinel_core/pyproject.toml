[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-core"
version = "1.1.0"
description = "Explainable, OWASP-mapped GraphQL operation analysis and demand control (the engine behind GraphQL Sentinel)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["graphql-core>=3.2,<4"]

[project.optional-dependencies]
ml = ["numpy", "scikit-learn", "joblib"]

[tool.setuptools]
packages = ["sentinel_core"]
package-dir = { sentinel_core = "." }
