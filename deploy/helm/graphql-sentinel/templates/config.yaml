{{- if .Values.schema.sdl }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinel.fullname" . }}-schema
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
data:
  schema.graphql: |
    {{- .Values.schema.sdl | nindent 4 }}
{{- end }}
{{- if and (ne .Values.persistedQueries.mode "off") .Values.persistedQueries.manifest }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinel.fullname" . }}-persisted
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
data:
  manifest.json: |
    {{- if kindIs "string" .Values.persistedQueries.manifest }}
    {{- .Values.persistedQueries.manifest | nindent 4 }}
    {{- else }}
    {{- toPrettyJson .Values.persistedQueries.manifest | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sentinel.fullname" . }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
