<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 532" width="1200" height="532" role="img" aria-labelledby="t d"><title id="t">Recall on attack categories withheld from training</title><desc id="d">For each attack category, the recall of the model alone, the rules alone and the shipped combination when that category was not in the training data.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style><rect x=".5" y=".5" width="1199" height="531" rx="12" fill="#09090b" stroke="#27272a"/><text x="40" y="44" font-size="18" font-weight="650" fill="#fafafa">Why the model never decides alone</text><text x="40" y="66" font-size="12.5" fill="#71717a">Recall on an attack category the model was never trained on (leave-one-category-out, held-out test set)</text><circle cx="44" cy="92" r="5" fill="#f87171"/><text x="56" y="96" font-size="12.5" fill="#a1a1aa">Model alone</text><circle cx="194" cy="92" r="5" fill="#a1a1aa"/><text x="206" y="96" font-size="12.5" fill="#a1a1aa">Rules alone</text><circle cx="344" cy="92" r="5" fill="#4ade80"/><text x="356" y="96" font-size="12.5" fill="#a1a1aa">Shipped blend</text><line x1="290.0" y1="104" x2="290.0" y2="438" stroke="#27272a" stroke-dasharray="3 5"/><text x="290.0" y="480" font-size="10.5" fill="#71717a" text-anchor="middle" class="m">0.00</text><line x1="502.5" y1="104" x2="502.5" y2="438" stroke="#27272a" stroke-dasharray="3 5"/><text x="502.5" y="480" font-size="10.5" fill="#71717a" text-anchor="middle" class="m">0.25</text><line x1="715.0" y1="104" x2="715.0" y2="438" stroke="#27272a" stroke-dasharray="3 5"/><text x="715.0" y="480" font-size="10.5" fill="#71717a" text-anchor="middle" class="m">0.50</text><line x1="927.5" y1="104" x2="927.5" y2="438" stroke="#27272a" stroke-dasharray="3 5"/><text x="927.5" y="480" font-size="10.5" fill="#71717a" text-anchor="middle" class="m">0.75</text><line x1="1140.0" y1="104" x2="1140.0" y2="438" stroke="#27272a" stroke-dasharray="3 5"/><text x="1140.0" y="480" font-size="10.5" fill="#71717a" text-anchor="middle" class="m">1.00</text><text x="274" y="122" font-size="13" fill="#fafafa" text-anchor="end">field duplication</text><line x1="290.0" y1="118" x2="917.9" y2="118" stroke="#27272a" stroke-width="3" stroke-linecap="round"/><circle cx="917.9" cy="118" r="0" fill="#a1a1aa"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.00s" fill="freeze"/></circle><circle cx="290.0" cy="118" r="0" fill="#f87171"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.00s" fill="freeze"/></circle><circle cx="747.0" cy="118" r="0" fill="#4ade80"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.00s" fill="freeze"/></circle><text x="274" y="152" font-size="13" fill="#fafafa" text-anchor="end">wide selection</text><line x1="290.0" y1="148" x2="1133.5" y2="148" stroke="#27272a" stroke-width="3" stroke-linecap="round"/><circle cx="1133.5" cy="148" r="0" fill="#a1a1aa"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.07s" fill="freeze"/></circle><circle cx="290.0" cy="148" r="0" fill="#f87171"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.07s" fill="freeze"/></circle><circle cx="1015.7" cy="148" r="0" fill="#4ade80"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.07s" fill="freeze"/></circle><text x="274" y="182" font-size="13" fill="#fafafa" text-anchor="end">list amplification</text><line x1="294.2" y1="178" x2="1004.0" y2="178" stroke="#27272a" stroke-width="3" stroke-linecap="round"/><circle cx="1004.0" cy="178" r="0" fill="#a1a1aa"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.14s" fill="freeze"/></circle><circle cx="294.2" cy="178" r="0" fill="#f87171"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.14s" fill="freeze"/></circle><circle cx="906.2" cy="178" r="0" fill="#4ade80"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.14s" fill="freeze"/></circle><text x="274" y="212" font-size="13" fill="#fafafa" text-anchor="end">introspection</text><line x1="450.6" y1="208" x2="1140.0" y2="208" stroke="#27272a" stroke-width="3" stroke-linecap="round"/><circle cx="1140.0" cy="208" r="0" fill="#a1a1aa"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.21s" fill="freeze"/></circle><circle cx="450.6" cy="208" r="0" fill="#f87171"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.21s" fill="freeze"/></circle><circle cx="544.0" cy="208" r="0" fill="#4ade80"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.21s" fill="freeze"/></circle><text x="274" y="242" font-size="13" fill="#fafafa" text-anchor="end">directive overload</text><line x1="625.8" y1="238" x2="987.0" y2="238" stroke="#27272a" stroke-width="3" stroke-linecap="round"/><circle cx="927.5" cy="238" r="0" fill="#a1a1aa"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.28s" fill="freeze"/></circle><circle cx="625.8" cy="238" r="0" fill="#f87171"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.28s" fill="freeze"/></circle><circle cx="987.0" cy="238" r="0" fill="#4ade80"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.28s" fill="freeze"/></circle><text x="274" y="272" font-size="13" fill="#fafafa" text-anchor="end">deep nesting</text><line x1="740.5" y1="268" x2="982.8" y2="268" stroke="#27272a" stroke-width="3" stroke-linecap="round"/><circle cx="982.8" cy="268" r="0" fill="#a1a1aa"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.35s" fill="freeze"/></circle><circle cx="740.5" cy="268" r="0" fill="#f87171"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.35s" fill="freeze"/></circle><circle cx="859.5" cy="268" r="0" fill="#4ade80"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.35s" fill="freeze"/></circle><text x="274" y="302" font-size="13" fill="#fafafa" text-anchor="end">fragment bomb</text><line x1="753.2" y1="298" x2="1140.0" y2="298" stroke="#27272a" stroke-width="3" stroke-linecap="round"/><circle cx="1140.0" cy="298" r="0" fill="#a1a1aa"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.42s" fill="freeze"/></circle><circle cx="753.2" cy="298" r="0" fill="#f87171"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.42s" fill="freeze"/></circle><circle cx="1140.0" cy="298" r="0" fill="#4ade80"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.42s" fill="freeze"/></circle><text x="274" y="332" font-size="13" fill="#fafafa" text-anchor="end">alias batching</text><line x1="1008.2" y1="328" x2="1140.0" y2="328" stroke="#27272a" stroke-width="3" stroke-linecap="round"/><circle cx="1008.2" cy="328" r="0" fill="#a1a1aa"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.49s" fill="freeze"/></circle><circle cx="1140.0" cy="328" r="0" fill="#f87171"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.49s" fill="freeze"/></circle><circle cx="1140.0" cy="328" r="0" fill="#4ade80"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.49s" fill="freeze"/></circle><text x="274" y="362" font-size="13" fill="#fafafa" text-anchor="end">credential stuffing</text><line x1="1140.0" y1="358" x2="1140.0" y2="358" stroke="#27272a" stroke-width="3" stroke-linecap="round"/><circle cx="1140.0" cy="358" r="0" fill="#a1a1aa"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.56s" fill="freeze"/></circle><circle cx="1140.0" cy="358" r="0" fill="#f87171"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.56s" fill="freeze"/></circle><circle cx="1140.0" cy="358" r="0" fill="#4ade80"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.56s" fill="freeze"/></circle><text x="274" y="392" font-size="13" fill="#fafafa" text-anchor="end">fragment depth</text><line x1="1140.0" y1="388" x2="1140.0" y2="388" stroke="#27272a" stroke-width="3" stroke-linecap="round"/><circle cx="1140.0" cy="388" r="0" fill="#a1a1aa"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.63s" fill="freeze"/></circle><circle cx="1140.0" cy="388" r="0" fill="#f87171"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.63s" fill="freeze"/></circle><circle cx="1140.0" cy="388" r="0" fill="#4ade80"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.63s" fill="freeze"/></circle><text x="274" y="422" font-size="13" fill="#fafafa" text-anchor="end">sensitive enumeration</text><line x1="1123.0" y1="418" x2="1140.0" y2="418" stroke="#27272a" stroke-width="3" stroke-linecap="round"/><circle cx="1123.0" cy="418" r="0" fill="#a1a1aa"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.70s" fill="freeze"/></circle><circle cx="1140.0" cy="418" r="0" fill="#f87171"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.70s" fill="freeze"/></circle><circle cx="1140.0" cy="418" r="0" fill="#4ade80"><animate attributeName="r" from="0" to="6" dur="0.5s" begin="0.70s" fill="freeze"/></circle><text x="1140" y="514" font-size="11.5" fill="#71717a" text-anchor="end">In-distribution the model alone scores F1 1.00; withheld, it misses whole categories.</text></svg>