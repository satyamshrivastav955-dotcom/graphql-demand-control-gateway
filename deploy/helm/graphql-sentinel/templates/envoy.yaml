{{- if and (eq .Values.mode "extproc") .Values.envoy.enabled }}
{{- $upstream := urlParse (required "upstream.url is required when envoy.enabled" .Values.upstream.url) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinel.fullname" . }}-envoy
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: ingress
          address: { socket_address: { address: 0.0.0.0, port_value: {{ .Values.envoy.port }} } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress
                    route_config:
                      name: local
                      virtual_hosts:
                        - name: graphql
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: upstream, timeout: 15s }
                    http_filters:
                      - name: envoy.filters.http.ext_proc
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                          grpc_service:
                            envoy_grpc: { cluster_name: sentinel_extproc }
                            timeout: 2s
                          failure_mode_allow: false
                          message_timeout: 2s
                          processing_mode:
                            request_header_mode: SEND
                            request_body_mode: BUFFERED
                            response_header_mode: SKIP
                            response_body_mode: NONE
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: upstream
          type: STRICT_DNS
          connect_timeout: 2s
          load_assignment:
            cluster_name: upstream
            endpoints:
              - lb_endpoints:
                  - endpoint: { address: { socket_address: { address: {{ $upstream.hostname | quote }}, port_value: {{ default 80 ($upstream.port | int) }} } } }
        - name: sentinel_extproc
          type: STRICT_DNS
          connect_timeout: 1s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config: { http2_protocol_options: {} }
          load_assignment:
            cluster_name: sentinel_extproc
            endpoints:
              - lb_endpoints:
                  - endpoint: { address: { socket_address: { address: {{ include "sentinel.fullname" . }}, port_value: {{ .Values.extproc.port }} } } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel.fullname" . }}-envoy
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.envoy.replicaCount }}
  selector:
    matchLabels:
      {{- include "sentinel.selector" . | nindent 6 }}
      app.kubernetes.io/component: envoy
  template:
    metadata:
      labels:
        {{- include "sentinel.selector" . | nindent 8 }}
        app.kubernetes.io/component: envoy
      annotations:
        checksum/config: {{ .Values.upstream.url | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: envoy
          image: {{ .Values.envoy.image | quote }}
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
          ports:
            - { name: http, containerPort: {{ .Values.envoy.port }} }
          readinessProbe:
            tcpSocket: { port: http }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: config, mountPath: /etc/envoy, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: {{ include "sentinel.fullname" . }}-envoy
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel.fullname" . }}-envoy
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "sentinel.selector" . | nindent 4 }}
    app.kubernetes.io/component: envoy
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
{{- end }}
