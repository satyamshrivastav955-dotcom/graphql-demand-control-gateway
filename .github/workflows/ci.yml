name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend ml demo
      - name: Tests
        run: python -m pytest --cov=backend --cov-report=term-missing --cov-fail-under=85

  ml-pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - name: Run the evaluation pipeline on a tiny dataset (does not overwrite the shipped model)
        run: python -m ml.run --per-category 40 --confirm-seed 0 --no-save-model --skip-bench

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit

  docker:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Create a throwaway management token
        run: echo "SENTINEL_API_TOKEN=ci-$(openssl rand -hex 16)" > .env
      - run: docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d --wait
          curl -fsS http://127.0.0.1:8080/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/events)" = 401
          . ./.env
          curl -fsS -H "Authorization: Bearer $SENTINEL_API_TOKEN" http://127.0.0.1:8080/api/config > /dev/null
          curl -fsS -X POST http://127.0.0.1:8080/graphql-proxy -H 'content-type: application/json' \
            -d '{"query":"{ users(first: 1) { name } }"}' | grep -q '"decision":"ALLOW"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/graphql-proxy \
            -H 'content-type: application/json' \
            -d "{\"query\":\"{ $(printf 'a { %.0s' {1..18})x$(printf ' }%.0s' {1..18}) }\"}")
          test "$code" = "403"
          docker compose down -v

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
        working-directory: dashboard
