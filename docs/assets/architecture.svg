<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d"><title id="t">Architecture</title><desc id="d">Clients reach the gateway through a TLS proxy; the gateway analyses, decides, forwards to the upstream and records every request.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style><rect x=".5" y=".5" width="1199" height="469" rx="12" fill="#09090b" stroke="#27272a"/><circle r="5" fill="#fafafa"><animateMotion dur="6s" repeatCount="indefinite" path="M166 210 H336 H386 V152 H916 H926 V210 H1164"/></circle><circle r="5" fill="#4ade80" opacity=".9"><animateMotion dur="6s" begin="2s" repeatCount="indefinite" path="M166 210 H336 H386 V152 H916 H926 V210 H1164"/></circle><rect x="36" y="175" width="130" height="70" rx="8" fill="#111113" stroke="#27272a"/><text x="101.0" y="206.0" font-size="14.5" font-weight="650" fill="#fafafa" text-anchor="middle">Clients</text><text x="101.0" y="225.0" font-size="11" fill="#71717a" text-anchor="middle" class="m">apps · scripts · browsers</text><rect x="206" y="175" width="130" height="70" rx="8" fill="#111113" stroke="#27272a"/><text x="271.0" y="206.0" font-size="14.5" font-weight="650" fill="#fafafa" text-anchor="middle">TLS proxy</text><text x="271.0" y="225.0" font-size="11" fill="#71717a" text-anchor="middle" class="m">Caddy / nginx</text><rect x="376" y="70" width="560" height="330" rx="12" fill="none" stroke="#27272a" stroke-dasharray="5 6"/><text x="396" y="94" font-size="12" fill="#71717a" class="m" letter-spacing="1.5">SENTINEL GATEWAY · FastAPI</text><rect x="396" y="120" width="118" height="64" rx="8" fill="#111113" stroke="#27272a"/><text x="455.0" y="148.0" font-size="14.5" font-weight="650" fill="#fafafa" text-anchor="middle">Validate</text><text x="455.0" y="167.0" font-size="11" fill="#71717a" text-anchor="middle" class="m">size · rate</text><line x1="514" y1="152" x2="530" y2="152" stroke="#71717a" stroke-width="1.5"/><rect x="530" y="120" width="118" height="64" rx="8" fill="#111113" stroke="#27272a"/><text x="589.0" y="148.0" font-size="14.5" font-weight="650" fill="#fafafa" text-anchor="middle">Analyze</text><text x="589.0" y="167.0" font-size="11" fill="#71717a" text-anchor="middle" class="m">AST · fragments</text><line x1="648" y1="152" x2="664" y2="152" stroke="#71717a" stroke-width="1.5"/><rect x="664" y="120" width="118" height="64" rx="8" fill="#111113" stroke="#27272a"/><text x="723.0" y="148.0" font-size="14.5" font-weight="650" fill="#fafafa" text-anchor="middle">Score</text><text x="723.0" y="167.0" font-size="11" fill="#71717a" text-anchor="middle" class="m">rules + model</text><line x1="782" y1="152" x2="798" y2="152" stroke="#71717a" stroke-width="1.5"/><rect x="798" y="120" width="118" height="64" rx="8" fill="#111113" stroke="#fafafa"/><text x="857.0" y="148.0" font-size="14.5" font-weight="650" fill="#fafafa" text-anchor="middle">Decide</text><text x="857.0" y="167.0" font-size="11" fill="#71717a" text-anchor="middle" class="m">policy tiers</text><rect x="396" y="232" width="252" height="56" rx="8" fill="#111113" stroke="#27272a"/><text x="522.0" y="256.0" font-size="14.5" font-weight="650" fill="#fafafa" text-anchor="middle">Enforce</text><text x="522.0" y="275.0" font-size="11" fill="#71717a" text-anchor="middle" class="m">ALLOW · THROTTLE 429 · BLOCK 403</text><rect x="668" y="232" width="248" height="56" rx="8" fill="#111113" stroke="#27272a"/><text x="792.0" y="256.0" font-size="14.5" font-weight="650" fill="#fafafa" text-anchor="middle">Shadow mode</text><text x="792.0" y="275.0" font-size="11" fill="#71717a" text-anchor="middle" class="m">record the decision, forward anyway</text><rect x="396" y="320" width="118" height="56" rx="8" fill="#111113" stroke="#27272a"/><text x="455.0" y="344.0" font-size="14.5" font-weight="650" fill="#fafafa" text-anchor="middle">Audit store</text><text x="455.0" y="363.0" font-size="11" fill="#71717a" text-anchor="middle" class="m">SQLite</text><rect x="530" y="320" width="118" height="56" rx="8" fill="#111113" stroke="#27272a"/><text x="589.0" y="344.0" font-size="14.5" font-weight="650" fill="#fafafa" text-anchor="middle">Metrics</text><text x="589.0" y="363.0" font-size="11" fill="#71717a" text-anchor="middle" class="m">Prometheus</text><rect x="664" y="320" width="118" height="56" rx="8" fill="#111113" stroke="#27272a"/><text x="723.0" y="344.0" font-size="14.5" font-weight="650" fill="#fafafa" text-anchor="middle">Alerts</text><text x="723.0" y="363.0" font-size="11" fill="#71717a" text-anchor="middle" class="m">webhook</text><rect x="798" y="320" width="118" height="56" rx="8" fill="#111113" stroke="#27272a"/><text x="857.0" y="344.0" font-size="14.5" font-weight="650" fill="#fafafa" text-anchor="middle">Dashboard</text><text x="857.0" y="363.0" font-size="11" fill="#71717a" text-anchor="middle" class="m">React · /app</text><rect x="986" y="175" width="178" height="70" rx="8" fill="#111113" stroke="#fafafa"/><text x="1075.0" y="206.0" font-size="14.5" font-weight="650" fill="#fafafa" text-anchor="middle">Your GraphQL API</text><text x="1075.0" y="225.0" font-size="11" fill="#71717a" text-anchor="middle" class="m">the only trusted upstream</text><line x1="166" y1="210" x2="206" y2="210" stroke="#a1a1aa" stroke-width="1.5"/><line x1="336" y1="210" x2="376" y2="210" stroke="#a1a1aa" stroke-width="1.5"/><line x1="936" y1="210" x2="986" y2="210" stroke="#a1a1aa" stroke-width="1.5"/><path d="M376 210 H386 V152 H396" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><path d="M455 184 V232" stroke="#71717a" stroke-width="1.5" fill="none"/><path d="M916 152 H926 V210 H936" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><path d="M520 288 V320 M588 288 V304 H589 V320 M724 288 V304 H723 V320 M857 288 V320" stroke="#27272a" stroke-width="1.5" fill="none"/><text x="600.0" y="448" font-size="12" fill="#71717a" text-anchor="middle" class="m">management API behind a bearer token · optional X-API-Key on the enforcing endpoint · the upstream is reachable only through the gateway</text></svg>